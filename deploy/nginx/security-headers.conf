# Security headers for the app, for nginx. Include this in every server
# block that serves the frontend:
#
#   sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/julenissen-security-headers.conf
#   # then, inside each server { } block, next to `index index.html;`:
#   #   include snippets/julenissen-security-headers.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx only passes add_header down into a location block that has no
# add_header of its own. If a location ever gets one, it must include this
# file again, or it silently loses all of these.

# Only the app's own files may run or style the page, and it may only talk
# to its own origin. Blocks injected code even if an XSS bug ever gets
# through.
#
# The app is built to need nothing more: no inline scripts (the theme
# script is public/theme.js) and no runtime <style> tags (the notes editor
# runs with injectCSS: false, its base styles in src/index.css). Anything
# new from another origin, or inline, has to be allowed here first. To try
# a change safely, rename the header to Content-Security-Policy-Report-Only:
# the browser then logs what it would block (DevTools console) without
# blocking it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

# Don't let browsers guess a file's type (e.g. run an upload as a script).
add_header X-Content-Type-Options "nosniff" always;

# Send only the origin, never the full URL, when following links elsewhere.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# No framing of the app by other sites (clickjacking). frame-ancestors above
# does the same for current browsers; this covers older ones.
add_header X-Frame-Options "DENY" always;
